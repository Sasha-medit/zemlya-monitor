<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Земельные лоты — мониторинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg: #1c2420; --bg-panel: #232d27; --bg-panel-2: #2a352e;
    --line: #3a473e; --text: #e8e4d8; --text-dim: #9aa89e;
    --accent: #c68a3e; --accent-soft: #c68a3e33; --teal: #6ea391; --danger: #c15c4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; min-height:100vh;}
  h1,h2{font-family:'Source Serif 4',serif; font-weight:600; margin:0;}
  a{color:var(--teal);}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); background:var(--bg-panel); flex-wrap:wrap; gap:12px;}
  .topbar h1{font-size:22px;}
  .topbar .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .update-box{display:flex; align-items:center; gap:10px;}
  .update-btn{background:var(--accent); color:#1c1408; border:none; padding:9px 16px; border-radius:3px; font-weight:600; font-size:13px; cursor:pointer;}
  .update-btn:disabled{opacity:0.5; cursor:default;}
  .update-status{font-size:12.5px; color:var(--text-dim); max-width:320px;}
  .layout{display:flex; min-height:calc(100vh - 74px); flex-wrap:wrap;}
  .sidebar{width:280px; flex-shrink:0; padding:20px; border-right:1px solid var(--line); background:var(--bg-panel); overflow-y:auto;}
  .filter-group{margin-bottom:22px;}
  .filter-group label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  select, input[type=text], input[type=number]{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:7px 8px; border-radius:3px; font-size:13px; font-family:'Inter',sans-serif;}
  select[multiple]{height:100px;}
  .range-row{display:flex; gap:8px;}
  .range-row input{width:50%;}
  .reset-btn{width:100%; background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:8px; border-radius:3px; cursor:pointer; font-size:12px; margin-top:4px;}
  .reset-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .count-badge{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); padding:8px 10px; border-radius:3px; font-size:13px; margin-bottom:18px;}
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .tabs{display:flex; gap:2px; padding:14px 24px 0; border-bottom:1px solid var(--line);}
  .tab{padding:9px 18px; cursor:pointer; color:var(--text-dim); font-size:13px; border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--accent); border-color:var(--accent);}
  .view{flex:1; padding:20px 24px; overflow:auto; display:none;}
  .view.active{display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:9px 10px; color:var(--text-dim); font-weight:500; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; position:sticky; top:0; background:var(--bg-panel);}
  th:hover{color:var(--accent);}
  td{padding:9px 10px; border-bottom:1px solid #2c352f; vertical-align:top;}
  tr:hover td{background:var(--bg-panel-2);}
  .price{font-family:'IBM Plex Mono',monospace; color:var(--accent);}
  .empty-state{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty-state h2{color:var(--text); margin-bottom:8px; font-size:18px;}
  #map{height:100%; width:100%; border-radius:4px; overflow:hidden;}
  .map-controls{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .geo-btn{background:var(--teal); color:#0e1a15; border:none; padding:8px 14px; border-radius:3px; font-weight:600; font-size:12.5px; cursor:pointer;}
  .geo-btn:disabled{opacity:0.5; cursor:default;}
  .geo-status{color:var(--text-dim); font-size:12.5px;}
  .popup-title{font-weight:600; margin-bottom:4px;}
  .popup-row{font-size:12px; margin-bottom:2px;}
  .error-box{background:#c15c4a22; border:1px solid var(--danger); color:#e8b3a8; padding:10px 12px; border-radius:3px; font-size:12.5px; margin:0 24px 16px;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#3a473e; border-radius:5px;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Земельные лоты</h1>
    <div class="sub">Извещения ЗК РФ (torgi.gov.ru) — сбор прямо в браузере</div>
  </div>
  <div class="update-box">
    <button class="update-btn" id="updateBtn">Обновить данные</button>
    <span class="update-status" id="updateStatus"></span>
  </div>
</div>

<div id="errorBox" class="error-box" style="display:none;"></div>

<div class="layout">
  <div class="sidebar">
    <div id="countBadge" class="count-badge">Нажмите «Обновить данные», чтобы начать</div>

    <div class="filter-group">
      <label>Регион</label>
      <select id="fRegion" multiple></select>
    </div>

    <div class="filter-group">
      <label>Категория земель</label>
      <select id="fCategory" multiple></select>
    </div>

    <div class="filter-group">
      <label>Вид разрешённого использования (ВРИ)</label>
      <select id="fVRI" multiple></select>
    </div>

    <div class="filter-group">
      <label>Вид сделки</label>
      <select id="fDealType" multiple></select>
    </div>

    <div class="filter-group">
      <label>Площадь, м²</label>
      <div class="range-row">
        <input type="number" id="fAreaMin" placeholder="от">
        <input type="number" id="fAreaMax" placeholder="до">
      </div>
    </div>

    <div class="filter-group">
      <label>Начальная цена, ₽</label>
      <div class="range-row">
        <input type="number" id="fPriceMin" placeholder="от">
        <input type="number" id="fPriceMax" placeholder="до">
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">Сбросить фильтры</button>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab active" data-view="table">Таблица</div>
      <div class="tab" data-view="map">Карта</div>
    </div>

    <div class="view active" id="viewTable">
      <div id="tableWrap">
        <div class="empty-state">
          <h2>Данных пока нет</h2>
          <div>Нажмите кнопку «Обновить данные» вверху страницы</div>
        </div>
      </div>
    </div>

    <div class="view" id="viewMap">
      <div class="map-controls">
        <button class="geo-btn" id="geoBtn">Показать отфильтрованные точки на карте</button>
        <span class="geo-status" id="geoStatus"></span>
      </div>
      <div id="map"></div>
    </div>
  </div>
</div>

<script>
// ============ НАСТРОЙКИ ============
const SEED_DAYS = 14;          // сколько дней истории собрать при самом первом обновлении
const BASE = "https://torgi.gov.ru/new/opendata/7710568760-notice";
const CORS_PROXY = "https://api.allorigins.win/raw?url=";  // запасной вариант, если сайт блокирует прямые запросы из браузера
// =====================================

let rawData = [];
let filtered = [];
let sortKey = null, sortDir = 1;
let leafletMap = null, markersLayer = null;
const geoCache = {};
const $ = (id) => document.getElementById(id);

function loadCache(){
  try {
    const raw = localStorage.getItem('zemlyaLots');
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function saveCache(lots){
  localStorage.setItem('zemlyaLots', JSON.stringify(lots));
  localStorage.setItem('zemlyaLastScan', new Date().toISOString().slice(0,10));
}
function getLastScanDate(){
  return localStorage.getItem('zemlyaLastScan');
}

async function fetchJsonSmart(url){
  try {
    const r = await fetch(url);
    if (r.ok) return await r.json();
  } catch(e){ /* похоже на блокировку CORS/сети - пробуем через прокси */ }
  try {
    const r2 = await fetch(CORS_PROXY + encodeURIComponent(url));
    if (r2.ok) return await r2.json();
  } catch(e2){ /* и прокси не помог */ }
  return null;
}

function toNumber(val){
  const n = parseFloat(val);
  return isNaN(n) ? null : n;
}

function extractLotRows(noticeJson){
  const rows = [];
  const notice = noticeJson?.exportObject?.structuredObject?.notice;
  if (!notice) return rows;

  const common = notice.commonInfo || {};
  const bidder = notice.bidderOrg?.orgInfo || {};
  const conditions = notice.biddConditions || {};

  const procedureName = (common.procedureName || "").toLowerCase();
  let dealType = null;
  if (procedureName.includes("аренд")) dealType = "Аренда";
  else if (procedureName.includes("собственност") || procedureName.includes("продаж") || procedureName.includes("купл")) dealType = "Продажа";

  for (const lot of (notice.lots || [])){
    const info = lot.biddingObjectInfo || {};
    const chars = {};
    (info.characteristics || []).forEach(c => { chars[c.code] = c.characteristicValue; });

    let permittedUse = chars.PermittedUse;
    if (Array.isArray(permittedUse)){
      permittedUse = permittedUse.map(v => v?.name || "").filter(Boolean).join("; ");
    }

    const regNum = common.noticeNumber;
    const lotNum = lot.lotNumber;

    rows.push({
      lotId: `${regNum}_${lotNum}`,
      regNum,
      dealType,
      publishDate: common.publishDate,
      region: info.subjectRF?.name,
      address: info.estateAddress,
      category: info.category?.name,
      permittedUse,
      cadastralNumber: chars.CadastralNumber,
      areaM2: toNumber(chars.SquareZU),
      priceMin: toNumber(lot.priceMin),
      biddStart: conditions.biddStartTime,
      biddEnd: conditions.biddEndTime,
      organizer: bidder.name,
      link: common.href,
    });
  }
  return rows;
}

function daterange(d1, d2){
  const days = [];
  const cur = new Date(d1);
  while (cur <= d2){ days.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  return days;
}
function fmt(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T0000`;
}

async function updateData(){
  const btn = $('updateBtn'), status = $('updateStatus'), errBox = $('errorBox');
  btn.disabled = true;
  errBox.style.display = 'none';

  const existing = loadCache();
  const existingById = {};
  existing.forEach(r => { if (r.lotId) existingById[r.lotId] = r; });

  const lastScan = getLastScanDate();
  const today = new Date();
  const start = lastScan ? new Date(Date.now() - 2*86400000) : new Date(Date.now() - SEED_DAYS*86400000);

  const days = daterange(start, today);
  let newCount = 0;
  let failedDays = 0;

  for (let i = 0; i < days.length; i++){
    const day = days[i];
    const nextDay = new Date(day.getTime() + 86400000);
    const indexUrl = `${BASE}/data-${fmt(day)}-${fmt(nextDay)}-structure-20240401.json`;

    status.textContent = `День ${i+1}/${days.length}: ${day.toLocaleDateString('ru-RU')}...`;
    const indexData = await fetchJsonSmart(indexUrl);
    if (!indexData){ failedDays++; continue; }

    const matches = (indexData.listObjects || []).filter(item =>
      item.documentType === "notice" && item.biddTypeCode === "ZK"
    );

    for (const item of matches){
      const noticeJson = await fetchJsonSmart(item.href);
      if (!noticeJson) continue;
      for (const row of extractLotRows(noticeJson)){
        if (!existingById[row.lotId]){
          existingById[row.lotId] = row;
          newCount++;
        }
      }
    }
  }

  const nowIso = new Date().toISOString();
  const fresh = Object.values(existingById).filter(r => !r.biddEnd || r.biddEnd >= nowIso);
  fresh.sort((a,b) => (b.publishDate||'').localeCompare(a.publishDate||''));

  saveCache(fresh);
  rawData = fresh;

  if (failedDays === days.length && days.length > 0){
    errBox.style.display = 'block';
    errBox.textContent = 'Не удалось подключиться к torgi.gov.ru ни разу — ни напрямую, ни через запасной прокси. Похоже на сетевую блокировку. Откройте консоль браузера (F12 → Console) и пришлите текст ошибки.';
  }

  status.textContent = `Готово. Новых лотов: ${newCount}. Всего активных: ${fresh.length}.`;
  btn.disabled = false;

  populateFilters();
  applyFilters();
}

$('updateBtn').addEventListener('click', updateData);

rawData = loadCache();
if (rawData.length){
  $('updateStatus').textContent = `В базе: ${rawData.length} лотов (сохранено ${getLastScanDate() || 'ранее'})`;
}

function uniqueSorted(field){ return [...new Set(rawData.map(r => r[field]).filter(Boolean))].sort(); }

function populateFilters(){
  const regionSel = $('fRegion'); regionSel.innerHTML = '';
  uniqueSorted('region').forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; regionSel.appendChild(o); });

  const catSel = $('fCategory'); catSel.innerHTML = '';
  uniqueSorted('category').forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; catSel.appendChild(o); });

  const vriSel = $('fVRI'); vriSel.innerHTML = '';
  uniqueSorted('permittedUse').forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; vriSel.appendChild(o); });

  const dealSel = $('fDealType'); dealSel.innerHTML = '';
  uniqueSorted('dealType').forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; dealSel.appendChild(o); });
}

function getSelectedValues(sel){ return [...sel.selectedOptions].map(o => o.value); }

function applyFilters(){
  const regions = getSelectedValues($('fRegion'));
  const cats = getSelectedValues($('fCategory'));
  const vris = getSelectedValues($('fVRI'));
  const dealTypes = getSelectedValues($('fDealType'));
  const areaMin = parseFloat($('fAreaMin').value), areaMax = parseFloat($('fAreaMax').value);
  const priceMin = parseFloat($('fPriceMin').value), priceMax = parseFloat($('fPriceMax').value);

  filtered = rawData.filter(r => {
    if (regions.length && !regions.includes(r.region)) return false;
    if (cats.length && !cats.includes(r.category)) return false;
    if (vris.length && !vris.includes(r.permittedUse)) return false;
    if (dealTypes.length && !dealTypes.includes(r.dealType)) return false;
    if (!isNaN(areaMin) && !(r.areaM2 >= areaMin)) return false;
    if (!isNaN(areaMax) && !(r.areaM2 <= areaMax)) return false;
    if (!isNaN(priceMin) && !(r.priceMin >= priceMin)) return false;
    if (!isNaN(priceMax) && !(r.priceMin <= priceMax)) return false;
    return true;
  });

  $('countBadge').textContent = `Найдено лотов: ${filtered.length} из ${rawData.length}`;
  renderTable();
}

function renderTable(){
  const wrap = $('tableWrap');
  if (!filtered.length){
    wrap.innerHTML = rawData.length
      ? `<div class="empty-state"><h2>Ничего не найдено</h2><div>Попробуйте изменить или сбросить фильтры</div></div>`
      : `<div class="empty-state"><h2>Данных пока нет</h2><div>Нажмите кнопку «Обновить данные» вверху страницы</div></div>`;
    return;
  }
  const cols = [
    ['region','Регион'], ['address','Адрес'], ['category','Категория'],
    ['permittedUse','ВРИ'], ['dealType','Сделка'], ['areaM2','Площадь, м²'], ['priceMin','Цена, ₽'],
    ['biddEnd','Приём заявок до'], ['organizer','Организатор']
  ];
  let rows = [...filtered];
  if (sortKey){
    rows.sort((a,b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'number' || typeof vb === 'number'){ va=va||0; vb=vb||0; return (va-vb)*sortDir; }
      va=(va||'').toString(); vb=(vb||'').toString();
      return va.localeCompare(vb,'ru')*sortDir;
    });
  }
  let html = '<table><thead><tr>';
  cols.forEach(([key,label]) => { html += `<th data-key="${key}">${label}${sortKey===key ? (sortDir>0?' ▲':' ▼') : ''}</th>`; });
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    cols.forEach(([key]) => {
      let val = r[key];
      if (key === 'priceMin'){ val = val ? `<span class="price">${Number(val).toLocaleString('ru-RU')}</span>` : '—'; }
      else if (key === 'areaM2'){ val = val ? Number(val).toLocaleString('ru-RU') : '—'; }
      else if (key === 'biddEnd' && val){ val = new Date(val).toLocaleDateString('ru-RU'); }
      else if (key === 'address' && r.link){ val = `<a href="${r.link}" target="_blank">${val || '—'}</a>`; }
      else { val = val || '—'; }
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      renderTable();
    });
  });
}

['fRegion','fCategory','fVRI','fDealType'].forEach(id => $(id).addEventListener('change', applyFilters));
['fAreaMin','fAreaMax','fPriceMin','fPriceMax'].forEach(id => $(id).addEventListener('input', applyFilters));

$('resetBtn').addEventListener('click', () => {
  $('fRegion').selectedIndex=-1; $('fCategory').selectedIndex=-1; $('fVRI').selectedIndex=-1;
  $('fDealType').selectedIndex=-1;
  $('fAreaMin').value=''; $('fAreaMax').value='';
  $('fPriceMin').value=''; $('fPriceMax').value='';
  applyFilters();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    $('view' + (tab.dataset.view === 'table' ? 'Table' : 'Map')).classList.add('active');
    if (tab.dataset.view === 'map' && leafletMap) setTimeout(() => leafletMap.invalidateSize(), 50);
  });
});

function initMap(){
  leafletMap = L.map('map').setView([61, 90], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 18 }).addTo(leafletMap);
  markersLayer = L.layerGroup().addTo(leafletMap);
}
initMap();

async function geocode(address){
  if (geoCache[address]) return geoCache[address];
  const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=ru&limit=1&q=${encodeURIComponent(address)}`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    const result = data && data[0] ? { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) } : null;
    geoCache[address] = result;
    return result;
  } catch(e){ return null; }
}

$('geoBtn').addEventListener('click', async () => {
  if (!filtered.length) return;
  const btn = $('geoBtn'), status = $('geoStatus');
  btn.disabled = true;
  markersLayer.clearLayers();
  const toGeocode = filtered.slice(0, 150);
  if (filtered.length > 150){ status.textContent = `Внимание: показаны первые 150 из ${filtered.length} — сузьте фильтры для остальных.`; }
  let found = 0; const bounds = [];
  for (let i=0; i<toGeocode.length; i++){
    const row = toGeocode[i];
    status.textContent = `Определяю координаты: ${i+1} / ${toGeocode.length}...`;
    if (!row.address) continue;
    const pos = await geocode(row.address);
    if (pos){
      found++; bounds.push([pos.lat, pos.lon]);
      const marker = L.circleMarker([pos.lat, pos.lon], { radius:6, color:'#c68a3e', fillColor:'#c68a3e', fillOpacity:0.8, weight:1.5 });
      const price = row.priceMin ? Number(row.priceMin).toLocaleString('ru-RU')+' ₽' : '—';
      const area = row.areaM2 ? Number(row.areaM2).toLocaleString('ru-RU')+' м²' : '—';
      marker.bindPopup(`<div class="popup-title">${row.address || 'Без адреса'}</div><div class="popup-row">Регион: ${row.region || '—'}</div><div class="popup-row">ВРИ: ${row.permittedUse || '—'}</div><div class="popup-row">Площадь: ${area}</div><div class="popup-row">Цена: ${price}</div>${row.link ? `<div class="popup-row"><a href="${row.link}" target="_blank">Открыть на torgi.gov.ru</a></div>` : ''}`);
      marker.addTo(markersLayer);
    }
    await new Promise(r => setTimeout(r, 1100));
  }
  status.textContent = `Готово: найдено координат для ${found} из ${toGeocode.length} адресов.`;
  if (bounds.length) leafletMap.fitBounds(bounds, { padding:[30,30] });
  btn.disabled = false;
});

populateFilters();
applyFilters();
</script>
</body>
</html>
