name: Update land lots data

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC = 06:00 по Москве
  workflow_dispatch:        # позволяет запускать вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "land-monitor-bot"
          git config user.email "actions@github.com"
          git add data/lots.json
          git diff --staged --quiet || git commit -m "Обновление данных: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
